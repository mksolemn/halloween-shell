&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

#haunted-shell *{box-sizing:border-box}
#haunted-shell button,#haunted-shell input{font:inherit}
#haunted-shell button{color:inherit}
#haunted-shell .sh-shell{--sh-blood:#af2926;--sh-glow:rgba(173,31,25,.4);position:relative;isolation:isolate;display:grid;grid-template-columns:228px minmax(0,1fr);grid-template-rows:80px minmax(590px,auto);background:#151617;color:#e7e2d9;overflow:hidden;border:1px solid #3e3832;border-radius:8px;box-shadow:0 12px 28px #0003;}
#haunted-shell .sh-header{grid-column:1/-1;display:flex;gap:18px;align-items:center;position:relative;z-index:5;padding:0 24px;background:linear-gradient(0deg,#0e0c0bb8,#171717b8),var(--sh-art) center 10%/100% auto;border-bottom:2px solid #4b2920;box-shadow:inset 0 1px #83715a35,0 8px 18px #0008}
#haunted-shell .sh-header:after{content:&#x27;&#x27;;position:absolute;bottom:-3px;left:0;right:0;height:3px;background:linear-gradient(90deg,#72221b,#ba442d 15%,#46130f 42%,#3a2621 75%,#8a261d);box-shadow:0 1px 7px #d1392233;pointer-events:none}
#haunted-shell .sh-brand{width:179px;flex-shrink:0;display:flex;align-items:center;gap:10px;position:relative}
#haunted-shell .sh-brand-icon{width:37px;height:40px;display:grid;place-items:center;background:linear-gradient(145deg,#514536,#181513);border:1px solid #75644c;clip-path:polygon(15% 0,85% 0,100% 15%,100% 85%,85% 100%,15% 100%,0 85%,0 15%);color:#d2bea0;box-shadow:inset 0 0 8px #000}
#haunted-shell .sh-brand-icon svg{width:24px;height:24px;filter:drop-shadow(0 2px 1px #000)}
#haunted-shell .sh-wordmark{font-family:Cinzel,Georgia,serif;font-size:28px;font-weight:600;letter-spacing:3px;color:#dfd2ba;text-shadow:0 2px 2px #000}
#haunted-shell .sh-brand small{display:block;font-family:&#x27;DM Sans&#x27;,sans-serif;font-size:9px;letter-spacing:3.2px;color:#bb7f6d;margin-top:-3px;font-weight:500}
#haunted-shell .sh-divider{height:24px;width:1px;background:#514236}
#haunted-shell .sh-workspace{display:flex;align-items:center;gap:8px;color:#c1b6a9;font-size:12px;white-space:nowrap}
#haunted-shell .sh-workspace svg{width:13px;height:13px;color:#827566}
#haunted-shell .sh-header-right{display:flex;align-items:center;gap:9px;margin-left:auto;padding-right:0}
#haunted-shell .sh-chrome-button{min-height:34px;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid #4a4036;border-radius:4px;background:linear-gradient(#28241f,#181614);padding:6px 10px;font-size:11px;color:#c9beb0;box-shadow:inset 0 1px #ffffff09,0 2px 2px #0005;transition:background .2s,border-color .2s}
#haunted-shell .sh-chrome-button:hover{background:linear-gradient(#3c2c23,#211714);border-color:#866047}
#haunted-shell .sh-chrome-button[aria-pressed=true]{border-color:#864132;color:#e2c2aa}
#haunted-shell .sh-chrome-button svg{width:14px;height:14px}
#haunted-shell .sh-bell{position:relative;padding:7px;width:34px}
#haunted-shell .sh-bell:after{content:&#x27;&#x27;;position:absolute;right:6px;top:5px;width:4px;height:4px;background:#d76043;box-shadow:0 0 6px #e54b2c}
#haunted-shell .sh-avatar{border:1px solid #6e5542;border-radius:50%;background:#33291f;min-width:32px;height:32px;color:#d4bf9d;font-size:11px;display:grid;place-items:center}
#haunted-shell .sh-blood-drips{position:absolute;left:0;right:0;top:78px;height:37px;pointer-events:none;z-index:6;opacity:var(--sh-gore,.85)}
#haunted-shell .sh-blood-drips b{position:absolute;top:0;height:var(--length);left:var(--left);width:var(--width,4px);border-radius:0 0 65% 65%;background:linear-gradient(90deg,#390d0b,#831f17 55%,#35100d);box-shadow:1px 0 #b8503020;transform-origin:top}
#haunted-shell .sh-blood-drips b:after{content:&#x27;&#x27;;position:absolute;bottom:0;left:0;width:100%;height:5px;border-radius:50%;background:#7b2018}
#haunted-shell .sh-sidebar{position:relative;z-index:2;display:flex;flex-direction:column;background:#121110;border-right:2px solid #392c24;box-shadow:5px 0 12px #0004;min-width:0;overflow:hidden}
#haunted-shell .sh-sidebar:before{content:&#x27;&#x27;;position:absolute;inset:0;z-index:-2;background:linear-gradient(#100f0ff5 0%,#141110f5 48%,#100e0cf0 57%,#110e0b22 80%,#100e0c99 100%),var(--sh-art) center bottom 44px/100% auto no-repeat;opacity:var(--sh-art-opacity,1)}
#haunted-shell .sh-sidebar:after{content:&#x27;&#x27;;position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,#63462f22,transparent 5%,transparent 95%,#3d251e66);box-shadow:inset 2px 0 #a38b5b12}
#haunted-shell .sh-nav-heading{display:flex;align-items:center;gap:8px;padding:28px 22px 13px;color:#988676;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase}
#haunted-shell .sh-nav-heading:after{content:&#x27;&#x27;;height:1px;flex:1;background:#4e3c2b80}
#haunted-shell .sh-navigation{padding:0 12px;display:flex;flex-direction:column;gap:6px}
#haunted-shell .sh-nav{position:relative;isolation:isolate;display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:43px;padding:9px 12px;border:1px solid transparent;background:transparent;border-radius:4px;font-size:13px;color:#baa996;transition:transform .12s,background .2s,border-color .2s,color .2s;}
#haunted-shell .sh-nav svg{width:17px;height:17px;flex-shrink:0;color:#9c8771;filter:drop-shadow(0 1px #000)}
#haunted-shell .sh-nav:hover{background:#30231cd4;border-color:#5d3f2c;color:#e1c8a9;transform:translateX(2px)}
#haunted-shell .sh-nav[aria-current=page]{background:linear-gradient(95deg,#57221bdf,#2e1b16e8);border-color:#82432d;color:#f4ddba;box-shadow:inset 0 1px #e2a0621a,0 2px 5px #0007}
#haunted-shell .sh-nav[aria-current=page]:before{content:&#x27;&#x27;;position:absolute;left:-13px;top:9px;bottom:9px;width:3px;background:#d6623b;box-shadow:0 0 10px #e03c22}
#haunted-shell .sh-nav[aria-current=page] svg{color:#e2b37e}
#haunted-shell .sh-nav-tail{margin-left:auto;font-size:10px;color:#a77f64}
#haunted-shell .sh-section-break{height:1px;background:linear-gradient(90deg,transparent,#5e443144,transparent);margin:12px 18px}
#haunted-shell .sh-nav-sub{margin-left:16px;border-left:1px solid #514035;padding-left:12px;color:#968573;display:none}
#haunted-shell .sh-nav-sub.is-open{display:block}
#haunted-shell .sh-nav-sub button{border:0;background:none;min-height:34px;font-size:12px;padding:4px 6px;text-align:left;color:#bda891}
#haunted-shell .sh-hanging{position:absolute;right:8px;top:75px;width:21px;height:106px;pointer-events:none;z-index:9;transform-origin:50% 0;filter:drop-shadow(2px 2px 2px #000)}
#haunted-shell .sh-hanging.sh-left-chain{left:218px;right:auto;height:71px;opacity:.95}
#haunted-shell .sh-chain-link{width:12px;height:22px;border:3px solid #514233;border-top-color:#8b7660;border-left-color:#7b6550;border-radius:7px;display:block;margin:-6px auto 0;box-shadow:inset 1px 0 2px #000,1px 0 #110c09;transform:rotate(-6deg)}
#haunted-shell .sh-chain-link:nth-child(even){width:8px;transform:rotate(8deg);border-color:#342c25;border-left-color:#9b7c57;margin-top:-8px}
#haunted-shell .sh-chain-button{position:relative;display:flex;align-items:center;gap:8px;align-self:center;margin:29px 0 0;padding:7px 12px 7px 9px;background:linear-gradient(#33291f,#1e1813);border:1px solid #72533a;border-radius:3px;color:#d5b38a;box-shadow:inset 0 1px #cba97a18,0 3px 4px #0008;font-size:10px;letter-spacing:1px;text-transform:uppercase}
#haunted-shell .sh-chain-button svg{width:14px;height:14px}
#haunted-shell .sh-chain-button:hover{border-color:#d08a53;color:#f3d9ac;box-shadow:0 0 15px #b1391d25}
#haunted-shell .sh-skull-space{position:relative;flex:1;min-height:186px;pointer-events:none}
#haunted-shell .sh-eyes{position:absolute;inset:0;background:radial-gradient(ellipse 6px 4px at 40% calc(100% - 91px),#e63320a0,transparent),radial-gradient(ellipse 6px 4px at 56% calc(100% - 91px),#e63320a0,transparent);opacity:.28;mix-blend-mode:screen}
#haunted-shell .sh-side-footer{border-top:1px solid #5038256b;background:#100e0be8;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:57px;color:#9c8872}
#haunted-shell .sh-side-footer span{font-size:9px;letter-spacing:1.5px;text-transform:uppercase}
#haunted-shell .sh-side-footer svg{width:15px;height:15px;color:#c19769}
#haunted-shell .sh-main{position:relative;min-width:0;background:radial-gradient(ellipse at 0 0,#29252255,transparent 50%),#1c1d1f;display:flex;flex-direction:column;padding:30px 36px 22px;}
#haunted-shell .sh-breadcrumb{display:flex;align-items:center;gap:8px;color:#97958f;font-size:11px;}
#haunted-shell .sh-breadcrumb svg{width:12px;height:12px}
#haunted-shell .sh-main h1{font-size:28px;letter-spacing:-1px;font-weight:500;line-height:1.2;margin:29px 0 8px;color:#ece8df;}
#haunted-shell .sh-intro{font-size:13px;color:#a6a39c;margin:0 0 34px;}
#haunted-shell .sh-content-label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px;color:#a6a39c;margin:0 0 12px;}
#haunted-shell .sh-content-label strong{font-weight:500;color:#d0ccc2}
#haunted-shell .sh-applications{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
#haunted-shell .sh-app{min-height:114px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:17px;background:#242527;border:1px solid #3b3b3b;border-radius:6px;color:#d8d4cb;transition:border-color .2s,background .2s,transform .2s;}
#haunted-shell .sh-app:hover{border-color:#82705a;background:#2a2927;transform:translateY(-2px)}
#haunted-shell .sh-app-top{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:15px;}
#haunted-shell .sh-app-icon{display:grid;place-items:center;background:#343331;width:30px;height:30px;border-radius:5px;color:#beb5a5;}
#haunted-shell .sh-app-icon svg{width:16px;height:16px}
#haunted-shell .sh-app-arrow{width:13px;height:13px;color:#7d7b74}
#haunted-shell .sh-app strong{font-size:12px;font-weight:500;}
#haunted-shell .sh-app small{font-size:11px;color:#99968f;margin-top:2px;}
#haunted-shell .sh-main-bottom{margin-top:auto;padding-top:32px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#817e76;font-size:10px}
#haunted-shell .sh-tiny-dot{width:5px;height:5px;border-radius:50%;background:#9c754f}
#haunted-shell .sh-main-bottom .sh-bottom-right{margin-left:auto;color:#ab8871;letter-spacing:1px;font-size:9px}

#haunted-shell .sh-chrome-button:hover{background:linear-gradient(#41493ce8,#202a22);border-image:var(--sh-door-art) 145 / 3px stretch}
#haunted-shell .sh-replay{background:linear-gradient(#34382a,#171d16)}
#haunted-shell .sh-gantry{background:linear-gradient(#06090b99,#0b1113f2),var(--sh-art) center 8%/100% auto}
#haunted-shell .sh-gantry-beam{height:32px;border:0;background:linear-gradient(#141b18b0,#070c0c55),var(--sh-door-art) center 66%/100% auto;box-shadow:0 3px 8px #000}
#haunted-shell .sh-gantry-beam:before{display:none}
#haunted-shell .sh-gantry-beam:after{bottom:-3px;height:6px;background:var(--sh-door-art) center 72%/100% auto;opacity:.8;border-radius:50%}
#haunted-shell .sh-hoist{background:linear-gradient(#242b21bb,#151c15bb),var(--sh-art) 0 20%/250px auto;border-color:#787c62;border-radius:9px 9px 15px 15px;box-shadow:inset 0 0 7px #000,0 2px 5px #000b}
#haunted-shell .sh-gantry-label{color:#a4b09c}
#haunted-shell .sh-gantry-phase{color:#758174}
#haunted-shell .sh-trolley-track{background:linear-gradient(#070b09 0 3px,#777f68 3px 4px,#1b2420 4px 9px,#78806c 9px 10px,#101713 10px);box-shadow:0 4px 6px #0009}
#haunted-shell .sh-sidebar{border-right:0;box-shadow:6px 0 18px #000b;background:#0f1514}
#haunted-shell .sh-sidebar:after{left:auto;right:-7px;top:0;bottom:0;width:22px;background:var(--sh-door-art) right center/auto 100%;box-shadow:none;mask-image:linear-gradient(90deg,transparent,#000 30%,#000 75%,transparent);filter:brightness(.8)}
#haunted-shell .sh-nav{border:3px solid transparent;border-radius:0;padding-top:8px;padding-bottom:8px;color:#b7c1ac}
#haunted-shell .sh-nav svg{color:#9caa95}
#haunted-shell .sh-nav:hover{background:#28332ab8;border-color:transparent;color:#e2e9d1}
#haunted-shell .sh-nav[aria-current=page]{border:3px solid transparent;border-image:var(--sh-door-art) 150 / 3px stretch;background:linear-gradient(90deg,#44392edb,#1f2d24e6);box-shadow:inset 0 0 14px #0008,0 2px 6px #0008;color:#e4e6ca}
#haunted-shell .sh-nav[aria-current=page] svg{color:#d1d6b6}
#haunted-shell .sh-nav[aria-current=page]:before{background:#a66249;box-shadow:0 0 8px #a82e2577;left:-14px}
#haunted-shell .sh-nav-heading{color:#95a18d}
#haunted-shell .sh-chain-button{border:4px solid transparent;border-image:var(--sh-door-art) 145 / 4px stretch;border-radius:0;background:linear-gradient(#252b20,#121a14);color:#c6c9a9;box-shadow:inset 0 0 9px #0008}
#haunted-shell .sh-side-footer{border:0;position:relative;background:#111813e8;color:#96a28a}
#haunted-shell .sh-side-footer:before{content:&#x27;&#x27;;position:absolute;top:-3px;left:0;right:0;height:7px;background:var(--sh-door-art) center 70%/100% auto;mask-image:linear-gradient(#000,transparent)}
#haunted-shell .sh-main{background:radial-gradient(ellipse at 0 0,#394b4233,transparent 58%),#171e20}
#haunted-shell .sh-app{position:relative;border:5px solid transparent;border-image:var(--sh-door-art) 180 / 5px stretch;border-radius:0;background:linear-gradient(#172120e8,#141e1ee8),var(--sh-art) center 22%/100% auto;box-shadow:inset 0 0 15px #0004;padding:14px}
#haunted-shell .sh-app:hover{border:5px solid transparent;border-image:var(--sh-door-art) 180 / 5px stretch;background:linear-gradient(#24312ae6,#18251fe6),var(--sh-art) center 22%/100% auto}
#haunted-shell .sh-app-icon{background:#303d34;border-radius:35% 25% 35% 30%;color:#b9c5aa}
#haunted-shell .sh-rail-shell .sh-main{border-right:0;box-shadow:none}
#haunted-shell .sh-rail-shell .sh-main:after{width:14px;background:var(--sh-door-art) right center/auto 100%;mask-image:linear-gradient(90deg,transparent,#000);right:0;top:0;bottom:0}
#haunted-shell .sh-entry-reset{display:flex;align-items:center;gap:5px;margin-left:auto;border:0;background:transparent;padding:4px 0;min-height:27px;font-size:10px;color:#aab69e}
#haunted-shell .sh-entry-reset:hover{color:#e1e8ce}
#haunted-shell .sh-entry-reset svg{width:12px;height:12px}
#haunted-shell .sh-main-bottom .sh-bottom-right{margin-left:auto}
#haunted-shell .sh-entrance{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:27px 24px 22px;background:#05090b;color:#d5ddc7;overflow:hidden;isolation:isolate;perspective:1500px}
#haunted-shell .sh-entrance[hidden]{display:none}
#haunted-shell .sh-entry-wall{position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% 40%,#09111577 0%,#03080be8 68%),linear-gradient(#071113aa,#010709c7),var(--sh-door-art) center 42%/cover;filter:saturate(.45);pointer-events:none}
#haunted-shell .sh-entry-wall:before,#haunted-shell .sh-entry-wall:after{content:&#x27;&#x27;;position:absolute;top:0;bottom:0;left:0;width:19%;background:linear-gradient(90deg,#0001,#03090bd9),var(--sh-art) left center/auto 105%;opacity:.65;box-shadow:15px 0 35px #000b}
#haunted-shell .sh-entry-wall:after{left:auto;right:0;transform:scaleX(-1)}
#haunted-shell .sh-entry-brand{position:relative;text-align:center;flex-shrink:0;z-index:3}
#haunted-shell .sh-entry-brand small{display:block;font-size:9px;line-height:1.4;letter-spacing:3.2px;color:#8a9d92;margin:0 0 5px}
#haunted-shell .sh-entry-brand h2{font-family:Cinzel,Georgia,serif;font-size:23px;line-height:1.3;font-weight:400;letter-spacing:4px;color:#d6dec9;margin:0;text-shadow:0 2px 8px #000}
#haunted-shell .sh-doorway{position:relative;flex:none;width:min(380px,calc(100% - 28px));aspect-ratio:2/3;perspective:1350px;isolation:isolate;filter:drop-shadow(0 16px 24px #000b)}
#haunted-shell .sh-door-jamb{position:absolute;inset:-16px;z-index:2;border:18px solid transparent;border-image:var(--sh-door-art) 75 / 18px stretch;box-shadow:0 0 0 3px #050909,inset 0 0 16px #000,0 0 35px #000b;pointer-events:none;filter:brightness(.65)}
#haunted-shell .sh-door-void{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 80%,#21332d55,transparent 60%),#010304;box-shadow:inset 0 0 55px #000}
#haunted-shell .sh-door-leaf{position:absolute;inset:0;z-index:3;transform-origin:0 50%;transform-style:preserve-3d;backface-visibility:hidden;background:var(--sh-door-art) center/100% 100%;box-shadow:inset 0 0 12px #0009,7px 0 12px #0009;will-change:transform}
#haunted-shell .sh-door-leaf:before{content:&#x27;&#x27;;position:absolute;inset:0;background:linear-gradient(110deg,#d8e5d211,transparent 40%,#0004);pointer-events:none;box-shadow:inset 2px 0 #b9c3a62b,inset -3px 0 #000}
#haunted-shell .sh-door-leaf:after{content:&#x27;&#x27;;position:absolute;right:-7px;top:0;bottom:0;width:7px;transform-origin:left;transform:rotateY(90deg);background:var(--sh-door-art) left center/auto 100%;filter:brightness(.4)}
#haunted-shell .sh-knocker{position:absolute;top:29%;left:50%;width:34%;aspect-ratio:2/3;transform:translateX(-50%);padding:0;border:0;background:transparent;perspective:500px;filter:drop-shadow(3px 5px 4px #000d);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#haunted-shell .sh-knocker-object{display:block;width:100%;height:100%;object-fit:contain;transform-origin:50% 12%;filter:brightness(.87) saturate(.72);user-select:none;pointer-events:none}
#haunted-shell .sh-knocker:hover .sh-knocker-object{filter:brightness(1.14) saturate(.65) drop-shadow(0 0 5px #d9ebbb20)}
#haunted-shell .sh-knocker:focus-visible{outline:2px solid #b9c7a9;outline-offset:4px;border-radius:30%}
#haunted-shell .sh-door-threshold{position:absolute;left:-23px;right:-23px;bottom:-16px;height:14px;background:var(--sh-door-art) center bottom/100% auto;box-shadow:0 8px 10px #000b;z-index:5;filter:brightness(.55)}
#haunted-shell .sh-entry-instructions{position:relative;z-index:5;flex-shrink:0;text-align:center;min-height:64px;margin-top:3px}
#haunted-shell .sh-entry-instructions strong{display:block;font-size:11px;line-height:1.5;letter-spacing:3px;font-weight:400;color:#bdc9b2;text-shadow:0 1px 4px #000}
#haunted-shell .sh-knock-marks{display:flex;align-items:center;justify-content:center;gap:19px;margin:8px 0 6px}
#haunted-shell .sh-knock-mark{display:block;height:12px;width:2px;background:#414f46;transform:rotate(12deg);box-shadow:1px 0 #090f0b;transition:background .2s,box-shadow .2s}
#haunted-shell .sh-knock-mark.sh-struck{background:#bcc8a4;box-shadow:0 0 7px #c6e2a344}
#haunted-shell .sh-knock-status{display:block;font-size:11px;color:#829889;min-height:17px;line-height:1.5}
#haunted-shell .sh-entry-sound{position:absolute;right:19px;top:18px;z-index:8;display:flex;align-items:center;gap:6px;padding:8px 2px;color:#a1b19a;border:0;background:transparent;font-size:10px;min-height:32px}
#haunted-shell .sh-entry-sound svg{width:13px;height:13px}
#haunted-shell .sh-entry-sound [data-lucide=volume-x]{display:none}
#haunted-shell .sh-entry-sound[aria-pressed=false] [data-lucide=volume-2]{display:none}
#haunted-shell .sh-entry-sound[aria-pressed=false] [data-lucide=volume-x]{display:block}
#haunted-shell .sh-door-dust{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
#haunted-shell .sh-dust-mote{position:absolute;width:2px;height:2px;background:#b9c7a46b;border-radius:50%;animation:sh-door-dust .7s ease-out forwards}
#haunted-shell .sh-gated .sh-header,#haunted-shell .sh-gated .sh-blood-drips{transform:translateY(-185px)}
#haunted-shell .sh-gated .sh-sidebar{transform:translateX(-115%)}
#haunted-shell .sh-gated .sh-shell .sh-hanging,#haunted-shell .sh-shell.sh-gated .sh-hanging{height:0}
@keyframes sh-door-dust{0%{transform:translate(0,0);opacity:.7}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
@media(max-width:780px){#haunted-shell .sh-main-bottom .sh-bottom-right{display:none}}
@media(max-width:560px){#haunted-shell .sh-entrance{padding:55px 17px 30px;gap:22px}#haunted-shell .sh-entry-brand small{font-size:8px;letter-spacing:2px}#haunted-shell .sh-entry-brand h2{font-size:17px;letter-spacing:2px}#haunted-shell .sh-doorway{width:calc(100% - 14px);max-width:330px}#haunted-shell .sh-door-jamb{inset:-11px;border-width:13px;border-image-width:13px}#haunted-shell .sh-entry-instructions{margin-top:0}#haunted-shell .sh-entry-instructions strong{font-size:10px;letter-spacing:2px}#haunted-shell .sh-entry-sound{top:12px;right:14px;font-size:10px}#haunted-shell .sh-main-bottom{font-size:9px}#haunted-shell .sh-entry-reset{font-size:9px;min-height:30px}#haunted-shell .sh-organic-frame{border-width:8px;border-image-width:8px}#haunted-shell .sh-app{padding:9px}#haunted-shell .sh-entry-wall:before,#haunted-shell .sh-entry-wall:after{width:13%}}
@media(pointer:coarse){#haunted-shell .sh-entry-sound,#haunted-shell .sh-entry-reset{min-height:44px}}

&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;haunted-shell&#x27;);
  const first = root.querySelector(&#x27;.sh-shell&#x27;);
  const second = first.cloneNode(true);
  second.classList.add(&#x27;sh-rail-shell&#x27;);
  second.setAttribute(&#x27;aria-label&#x27;, &#x27;Haunted fuel terminal with compact navigation rail&#x27;);
  root.querySelector(&#x27;[data-variant=&quot;The iron cage&quot;]&#x27;).append(second);
  const shells = [first, second];
  const preference = matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
  const saved = window.openai?.widgetState?.modelContent || {};
  const state = {
    gore: typeof saved.gore === &#x27;number&#x27; ? saved.gore : 100,
    motion: saved.motion ?? !preference.matches,
    sound: saved.sound ?? true,
    pace: typeof saved.pace === &#x27;number&#x27; ? saved.pace : 1.1,
  };
  let audio = null;
  let output = null;
  let noiseBuffer = null;
  let activeArrival = null;
  let voices = 0;
  const entry = {count: 0, queued: 0, phase: &#x27;locked&#x27;, busy: false, timers: [], animations: []};

  shells.forEach(shell =&gt; {
    shell.querySelectorAll(&#x27;.sh-hanging&#x27;).forEach(line =&gt; {
      const feed = document.createElement(&#x27;span&#x27;);
      feed.className = &#x27;sh-chain-feed&#x27;;
      feed.style.display = &#x27;block&#x27;;
      feed.style.paddingTop = &#x27;4px&#x27;;
      feed.append(...Array.from(line.children));
      while (feed.children.length &lt; 16) {
        const link = document.createElement(&#x27;span&#x27;);
        link.className = &#x27;sh-chain-link&#x27;;
        feed.append(link);
      }
      line.append(feed);
    });
    shell.querySelectorAll(&#x27;.sh-nav&#x27;).forEach(button =&gt; {
      button.setAttribute(&#x27;data-tooltip&#x27;, button.getAttribute(&#x27;aria-label&#x27;));
    });
  });

  const destinations = Object.freeze({
    Home: [&#x27;Good evening, mortal.&#x27;, &#x27;Keeping fuel and fleets moving. Even after dark.&#x27;],
    &#x27;Fuel sales&#x27;: [&#x27;Fuel sales&#x27;, &#x27;Orders, pricing and customers. The lifeblood of the operation.&#x27;],
    Dispatch: [&#x27;Dispatch&#x27;, &#x27;Loads, routes and deliveries. The night shift keeps moving.&#x27;],
    Fleet: [&#x27;Fleet&#x27;, &#x27;Tankers, trucks and drivers. Ready for the long haul.&#x27;],
    Documents: [&#x27;Documents&#x27;, &#x27;Delivery notes and records. Every load leaves a trail.&#x27;],
    Settings: [&#x27;Settings&#x27;, &#x27;A few adjustments to your eternal workspace.&#x27;],
    Federations: [&#x27;Federations&#x27;, &#x27;Connected applications. Every terminal has a way in.&#x27;],
  });

  function remember() {
    window.openai?.setWidgetState?.({
      modelContent: {gore: state.gore, motion: state.motion, sound: state.sound, pace: state.pace, entrance: entry.phase, knocks: entry.count},
      privateContent: {},
    }).catch(() =&gt; {});
  }

  function render() {
    const ready = audio?.state === &#x27;running&#x27;;
    if (output &amp;&amp; audio) output.gain.setTargetAtTime(state.sound ? .32 : 0, audio.currentTime, .025);
    shells.forEach(shell =&gt; {
      shell.style.setProperty(&#x27;--sh-gore&#x27;, String(state.gore / 100));
      shell.style.setProperty(&#x27;--sh-art-opacity&#x27;, String(.35 + state.gore / 150));
      shell.classList.toggle(&#x27;sh-motion-off&#x27;, !state.motion || preference.matches);
      const motion = shell.querySelector(&#x27;.sh-motion&#x27;);
      motion.setAttribute(&#x27;aria-pressed&#x27;, String(state.motion &amp;&amp; !preference.matches));
      motion.querySelector(&#x27;span&#x27;).textContent = state.motion &amp;&amp; !preference.matches ? &#x27;Effects on&#x27; : &#x27;Effects off&#x27;;
      const sound = shell.querySelector(&#x27;.sh-sound&#x27;);
      sound.setAttribute(&#x27;aria-pressed&#x27;, String(state.sound &amp;&amp; ready));
      sound.querySelector(&#x27;span&#x27;).textContent = state.sound ? (ready ? &#x27;Sound on&#x27; : &#x27;Enable sound&#x27;) : &#x27;Sound off&#x27;;
      const entrySound = shell.querySelector(&#x27;.sh-entry-sound&#x27;);
      entrySound.setAttribute(&#x27;aria-pressed&#x27;, String(state.sound));
      entrySound.querySelector(&#x27;span&#x27;).textContent = state.sound ? &#x27;Sound on&#x27; : &#x27;Sound off&#x27;;
    });
  }

  function toast(shell, text) {
    const element = shell.querySelector(&#x27;.sh-toast&#x27;);
    clearTimeout(shell.toastTimer);
    element.textContent = text;
    element.classList.add(&#x27;sh-show&#x27;);
    shell.toastTimer = setTimeout(() =&gt; element.classList.remove(&#x27;sh-show&#x27;), 2500);
  }

  function getAudio() {
    if (audio) return audio;
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return null;
    audio = new Audio();
    const limiter = audio.createDynamicsCompressor();
    limiter.threshold.value = -16;
    limiter.knee.value = 12;
    limiter.ratio.value = 5;
    limiter.attack.value = .003;
    limiter.release.value = .18;
    output = audio.createGain();
    output.gain.value = state.sound ? .32 : 0;
    output.connect(limiter);
    limiter.connect(audio.destination);
    const room = audio.createConvolver();
    const impulse = audio.createBuffer(2, Math.floor(audio.sampleRate * 1.5), audio.sampleRate);
    for (let channel = 0; channel &lt; 2; channel++) {
      const data = impulse.getChannelData(channel);
      for (let i = 0; i &lt; data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 3.8);
    }
    room.buffer = impulse;
    const reflection = audio.createDelay(.2);
    reflection.delayTime.value = .035;
    const wet = audio.createGain();
    wet.gain.value = .13;
    output.connect(reflection);
    reflection.connect(room);
    room.connect(wet);
    wet.connect(limiter);
    noiseBuffer = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
    const samples = noiseBuffer.getChannelData(0);
    for (let i = 0; i &lt; samples.length; i++) samples[i] = Math.random() * 2 - 1;
    audio.addEventListener(&#x27;statechange&#x27;, render);
    return audio;
  }

  async function unlock() {
    try {
      const context = getAudio();
      if (!context) return false;
      if (context.state !== &#x27;running&#x27;) await context.resume();
      render();
      return context.state === &#x27;running&#x27;;
    } catch {
      return false;
    }
  }

  function engine() {
    return state.sound &amp;&amp; audio?.state === &#x27;running&#x27; ? audio : null;
  }

  function retain(source, track, cleanup) {
    if (track) track.sources.push(source);
    voices++;
    root.dataset.audioVoices = String(voices);
    source.onended = () =&gt; { try { cleanup(); } catch {} };
  }

  function noise(at, duration, level, frequency, type = &#x27;bandpass&#x27;, q = 1, track = null, held = false, endFrequency = null) {
    const ctx = engine();
    if (!ctx) return;
    const source = ctx.createBufferSource();
    source.buffer = noiseBuffer;
    source.loop = true;
    const filter = ctx.createBiquadFilter();
    filter.type = type;
    filter.frequency.setValueAtTime(frequency, at);
    if (endFrequency) filter.frequency.exponentialRampToValueAtTime(endFrequency, at + duration);
    filter.Q.value = q;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(.0001, at);
    gain.gain.exponentialRampToValueAtTime(level, at + Math.min(.02, duration / 5));
    if (held) gain.gain.setValueAtTime(level, at + duration * .82);
    gain.gain.exponentialRampToValueAtTime(.0001, at + duration);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(output);
    retain(source, track, () =&gt; {source.disconnect(); filter.disconnect(); gain.disconnect();});
    source.start(at);
    source.stop(at + duration + .02);
  }

  function tone(at, frequency, endFrequency, duration, level, type = &#x27;sine&#x27;, track = null, held = false) {
    const ctx = engine();
    if (!ctx) return;
    const source = ctx.createOscillator();
    const gain = ctx.createGain();
    source.type = type;
    source.frequency.setValueAtTime(frequency, at);
    source.frequency.exponentialRampToValueAtTime(endFrequency, at + duration);
    gain.gain.setValueAtTime(.0001, at);
    gain.gain.exponentialRampToValueAtTime(level, at + .005);
    if (held) gain.gain.setValueAtTime(level, at + duration * .82);
    gain.gain.exponentialRampToValueAtTime(.0001, at + duration);
    source.connect(gain);
    gain.connect(output);
    retain(source, track, () =&gt; {source.disconnect(); gain.disconnect();});
    source.start(at);
    source.stop(at + duration + .02);
  }

  function clunk(at, heavy = false, track = null) {
    noise(at, heavy ? .23 : .12, heavy ? .45 : .23, 1250, &#x27;lowpass&#x27;, 1, track, false, 130);
    [heavy ? 76 : 122, 263, 731, 1637].forEach((hz, i) =&gt; {
      tone(at + i * .003, hz, hz * .91, (heavy ? .65 : .32) / (1 + i * .2), (heavy ? .34 : .17) / (i + 1), &#x27;sine&#x27;, track);
    });
  }

  function chainTick(at, track = null) {
    noise(at, .075, .11, 2100, &#x27;bandpass&#x27;, .8, track);
    tone(at, 1427, 1230, .11, .022, &#x27;sine&#x27;, track);
    tone(at + .011, 2471, 2250, .065, .009, &#x27;sine&#x27;, track);
  }

  function clickSound() {
    const ctx = engine();
    if (!ctx) return;
    const t = ctx.currentTime;
    noise(t, .16, .19, 1050, &#x27;lowpass&#x27;, 4, null, false, 70);
    tone(t, 164, 46, .18, .23);
    tone(t + .005, 647, 585, .14, .035);
  }

  function arrivalSound(track, pace) {
    const ctx = engine();
    if (!ctx) return;
    const t = ctx.currentTime + .02;
    noise(t + .04 * pace, 1.22 * pace, .12, 470, &#x27;bandpass&#x27;, .65, track, true, 315);
    tone(t + .04 * pace, 57, 47, 1.24 * pace, .065, &#x27;triangle&#x27;, track, true);
    for (let tick = .09; tick &lt; 1.23; tick += .073) chainTick(t + tick * pace, track);
    clunk(t + 1.25 * pace, false, track);
    noise(t + 1.43 * pace, .92 * pace, .19, 410, &#x27;bandpass&#x27;, .7, track, true, 170);
    tone(t + 1.43 * pace, 43, 28, .98 * pace, .075, &#x27;triangle&#x27;, track, true);
    for (let tick = 1.5; tick &lt; 2.35; tick += .132) noise(t + tick * pace, .075, .13, 1100, &#x27;bandpass&#x27;, .7, track);
    clunk(t + 2.38 * pace, true, track);
    noise(t + 2.48 * pace, .4 * pace, .12, 1800, &#x27;highpass&#x27;, .6, track);
  }

  function phase(shell, value) {
    shell.dataset.phase = value;
    shell.querySelector(&#x27;.sh-gantry-phase&#x27;).textContent = {
      hoisting: &#x27;Chain hoists engaged · lowering header&#x27;,
      rolling: &#x27;Roller carriage engaged · docking sidebar&#x27;,
      locked: &#x27;Bay 13 · carriage locked&#x27;,
    }[value];
  }

  function cancelArrival(shell) {
    const track = shell.arrivalTrack;
    if (track) {
      track.timers.forEach(clearTimeout);
      track.animations.forEach(animation =&gt; animation.cancel());
      track.sources.forEach(source =&gt; {try {source.stop();} catch {}});
    }
    shell.arrivalTrack = null;
    delete shell.dataset.arriving;
    phase(shell, &#x27;locked&#x27;);
    if (activeArrival === shell) activeArrival = null;
  }

  function arrive(shell, automatic = false) {
    if (activeArrival) cancelArrival(activeArrival);
    cancelArrival(shell);
    if (automatic) shell.dataset.automaticArrival = &#x27;played&#x27;;
    const pace = Math.max(.65, Math.min(1.5, state.pace));
    if (!state.motion || preference.matches) {
      if (engine()) clunk(audio.currentTime, false);
      return;
    }
    const track = {animations: [], timers: [], sources: []};
    shell.arrivalTrack = track;
    activeArrival = shell;
    shell.dataset.arriving = &#x27;true&#x27;;
    shell.dataset.arrivalCount = String(Number(shell.dataset.arrivalCount || 0) + 1);
    phase(shell, &#x27;hoisting&#x27;);
    const animate = (element, frames, options) =&gt; {
      const animation = element.animate(frames, {fill: &#x27;both&#x27;, ...options});
      track.animations.push(animation);
    };
    const lower = [
      {transform: &#x27;translateY(-185px)&#x27;, offset: 0},
      {transform: &#x27;translateY(-185px)&#x27;, offset: .035},
      {transform: &#x27;translateY(4px)&#x27;, offset: .9},
      {transform: &#x27;translateY(-1px)&#x27;, offset: .96},
      {transform: &#x27;translateY(0)&#x27;, offset: 1},
    ];
    [shell.querySelector(&#x27;.sh-header&#x27;), shell.querySelector(&#x27;.sh-blood-drips&#x27;)].forEach(element =&gt; {
      animate(element, lower, {duration: 1350 * pace, easing: &#x27;cubic-bezier(.35,.05,.35,1)&#x27;});
    });
    const chainLength = parseFloat(getComputedStyle(shell).getPropertyValue(&#x27;--sh-gantry-height&#x27;)) - 29;
    shell.querySelectorAll(&#x27;.sh-hanging&#x27;).forEach(line =&gt; {
      animate(line, [{height: &#x27;0px&#x27;, offset: 0}, {height: &#x27;0px&#x27;, offset: .34}, {height: (chainLength + 4) + &#x27;px&#x27;, offset: .9}, {height: chainLength + &#x27;px&#x27;, offset: 1}], {duration: 1350 * pace, easing: &#x27;cubic-bezier(.35,.05,.35,1)&#x27;});
      animate(line.querySelector(&#x27;.sh-chain-feed&#x27;), [{transform: &#x27;translateY(-13px)&#x27;}, {transform: &#x27;translateY(0)&#x27;}], {duration: 95 * pace, iterations: 13, easing: &#x27;linear&#x27;});
    });
    shell.querySelectorAll(&#x27;.sh-sprocket&#x27;).forEach((wheel, i) =&gt; {
      animate(wheel, [{transform: &#x27;rotate(0deg)&#x27;}, {transform: `rotate(${i ? -540 : 540}deg)`}], {duration: 1300 * pace, easing: &#x27;steps(32,end)&#x27;});
    });
    animate(shell.querySelector(&#x27;.sh-sidebar&#x27;), [
      {transform: &#x27;translateX(-115%)&#x27;, offset: 0},
      {transform: &#x27;translateX(-115%)&#x27;, offset: .04},
      {transform: &#x27;translateX(3px)&#x27;, offset: .94},
      {transform: &#x27;translateX(0)&#x27;, offset: 1},
    ], {duration: 1000 * pace, delay: 1420 * pace, easing: &#x27;cubic-bezier(.3,0,.25,1)&#x27;});
    shell.querySelectorAll(&#x27;.sh-roller&#x27;).forEach(wheel =&gt; {
      animate(wheel, [{transform: &#x27;rotate(-1080deg)&#x27;}, {transform: &#x27;rotate(0)&#x27;}], {duration: 1000 * pace, delay: 1420 * pace, easing: &#x27;cubic-bezier(.3,0,.25,1)&#x27;});
    });
    animate(shell.querySelector(&#x27;.sh-gauge-needle&#x27;), [{transform: &#x27;rotate(-115deg)&#x27;}, {transform: &#x27;rotate(-29deg)&#x27;, offset: .82}, {transform: &#x27;rotate(-37deg)&#x27;}], {duration: 1150 * pace, delay: 1200 * pace});
    track.timers.push(setTimeout(() =&gt; phase(shell, &#x27;rolling&#x27;), 1420 * pace));
    track.timers.push(setTimeout(() =&gt; phase(shell, &#x27;locked&#x27;), 2440 * pace));
    track.timers.push(setTimeout(() =&gt; {
      track.animations.forEach(animation =&gt; animation.cancel());
      delete shell.dataset.arriving;
      shell.arrivalTrack = null;
      activeArrival = null;
    }, 3100 * pace));
    arrivalSound(track, pace);
  }

  function burst(shell, event, heavy = false) {
    if (!state.motion || preference.matches) return;
    const bounds = shell.getBoundingClientRect();
    const control = event.currentTarget?.getBoundingClientRect() || event.target.getBoundingClientRect();
    const x = event.detail === 0 ? control.left + control.width / 2 - bounds.left : event.clientX - bounds.left;
    const y = event.detail === 0 ? control.top + control.height / 2 - bounds.top : event.clientY - bounds.top;
    const layer = shell.querySelector(&#x27;.sh-effect-layer&#x27;);
    const count = Math.round((heavy ? 18 : 10) * state.gore / 100);
    for (let i = 0; i &lt; count; i++) {
      const dot = document.createElement(&#x27;span&#x27;);
      dot.className = &#x27;sh-splatter&#x27;;
      dot.style.left = x + &#x27;px&#x27;;
      dot.style.top = y + &#x27;px&#x27;;
      const angle = Math.random() * Math.PI * 2;
      const distance = 8 + Math.random() * (heavy ? 64 : 38);
      dot.style.setProperty(&#x27;--dx&#x27;, Math.cos(angle) * distance + &#x27;px&#x27;);
      dot.style.setProperty(&#x27;--dy&#x27;, Math.sin(angle) * distance + 15 + &#x27;px&#x27;);
      dot.style.setProperty(&#x27;--scale&#x27;, String(.3 + Math.random() * 1.2));
      layer.append(dot);
      setTimeout(() =&gt; dot.remove(), 600);
    }
    if (heavy) for (let i = 0; i &lt; 8; i++) {
      const puff = document.createElement(&#x27;span&#x27;);
      puff.className = &#x27;sh-vent&#x27;;
      puff.style.left = x + &#x27;px&#x27;;
      puff.style.top = y + &#x27;px&#x27;;
      puff.style.setProperty(&#x27;--dx&#x27;, 10 + Math.random() * 65 + &#x27;px&#x27;);
      puff.style.setProperty(&#x27;--dy&#x27;, -10 - Math.random() * 40 + &#x27;px&#x27;);
      layer.append(puff);
      setTimeout(() =&gt; puff.remove(), 750);
    }
  }

  function navigate(shell, label) {
    const content = destinations[label] || destinations.Home;
    shell.querySelectorAll(&#x27;.sh-nav&#x27;).forEach(button =&gt; {
      if (button.dataset.page === label) button.setAttribute(&#x27;aria-current&#x27;, &#x27;page&#x27;);
      else button.removeAttribute(&#x27;aria-current&#x27;);
    });
    shell.querySelector(&#x27;.sh-page-name&#x27;).textContent = label;
    shell.querySelector(&#x27;.sh-page-title&#x27;).textContent = content[0];
    shell.querySelector(&#x27;.sh-intro&#x27;).textContent = content[1];
    shell.querySelector(&#x27;.sh-nav-sub&#x27;).classList.toggle(&#x27;is-open&#x27;, label === &#x27;Settings&#x27; || label === &#x27;Federations&#x27;);
    const panel = shell.querySelector(&#x27;.sh-context-panel&#x27;);
    panel.classList.toggle(&#x27;sh-show&#x27;, label !== &#x27;Home&#x27;);
    panel.querySelector(&#x27;strong&#x27;).textContent = label;
    panel.querySelector(&#x27;p&#x27;).textContent = &#x27;Preview destination · &#x27; + label.toLowerCase() + &#x27; opens inside the shell.&#x27;;
  }

  function setSiteAvailable(shell, available) {
    for (const child of shell.children) {
      if (!child.classList.contains(&#x27;sh-entrance&#x27;)) child.inert = !available;
    }
  }

  function updateEntry() {
    shells.forEach(shell =&gt; {
      shell.dataset.entryState = entry.phase;
      const gate = shell.querySelector(&#x27;.sh-entrance&#x27;);
      const knocker = gate.querySelector(&#x27;.sh-knocker&#x27;);
      knocker.setAttribute(&#x27;aria-label&#x27;, `Knock on the door. ${entry.count} of 3 knocks`);
      knocker.setAttribute(&#x27;aria-disabled&#x27;, String(entry.count + entry.queued &gt;= 3 || entry.phase !== &#x27;locked&#x27;));
      gate.querySelectorAll(&#x27;.sh-knock-mark&#x27;).forEach((mark, i) =&gt; mark.classList.toggle(&#x27;sh-struck&#x27;, i &lt; entry.count));
      gate.querySelector(&#x27;.sh-knock-status&#x27;).textContent = entry.phase === &#x27;opening&#x27;
        ? &#x27;The latch is releasing…&#x27;
        : entry.count === 0 ? &#x27;0 of 3 · Use the skeletal hand&#x27;
        : entry.queued &gt; 0 ? `${entry.count} of 3 · Listening…`
        : entry.count &lt; 3 ? `${entry.count} of 3 · ${3 - entry.count} more ${entry.count === 2 ? &#x27;knock&#x27; : &#x27;knocks&#x27;}`
        : &#x27;3 of 3 · Something heard you&#x27;;
    });
  }

  function animateEntry(element, frames, options) {
    if (!state.motion || preference.matches) return;
    const animation = element.animate(frames, {fill: &#x27;both&#x27;, ...options});
    entry.animations.push(animation);
    return animation;
  }

  function entryDust(gate) {
    if (!state.motion || preference.matches) return;
    const layer = gate.querySelector(&#x27;.sh-door-dust&#x27;);
    for (let i = 0; i &lt; 12; i++) {
      const dust = document.createElement(&#x27;span&#x27;);
      dust.className = &#x27;sh-dust-mote&#x27;;
      dust.style.left = (44 + Math.random() * 12) + &#x27;%&#x27;;
      dust.style.top = (41 + Math.random() * 5) + &#x27;%&#x27;;
      dust.style.setProperty(&#x27;--dx&#x27;, (Math.random() - .5) * 60 + &#x27;px&#x27;);
      dust.style.setProperty(&#x27;--dy&#x27;, (12 + Math.random() * 55) + &#x27;px&#x27;);
      layer.append(dust);
      setTimeout(() =&gt; dust.remove(), 750);
    }
  }

  function knockSound() {
    const ctx = engine();
    if (!ctx) return;
    const t = ctx.currentTime + .19;
    noise(t, .105, .4, 830, &#x27;lowpass&#x27;, .8, null, false, 160);
    tone(t, 94, 67, .43, .48);
    tone(t + .006, 191, 170, .32, .17);
    tone(t + .008, 467, 410, .23, .055);
    tone(t + .012, 1127, 1050, .47, .03);
    noise(t + .028, .11, .06, 2200, &#x27;bandpass&#x27;, .7);
  }

  function doorOpeningSound() {
    const ctx = engine();
    if (!ctx) return;
    const t = ctx.currentTime;
    clunk(t + .04, false);
    chainTick(t + .13);
    chainTick(t + .24);
    noise(t + .12, 1.5, .19, 330, &#x27;bandpass&#x27;, 2.5, null, true, 105);
    tone(t + .19, 78, 41, 1.5, .085, &#x27;triangle&#x27;);
    tone(t + .4, 293, 121, 1.15, .026, &#x27;triangle&#x27;);
    noise(t + .8, .65, .075, 1500, &#x27;highpass&#x27;, .5);
  }

  function finishEntry() {
    if (entry.phase === &#x27;entered&#x27;) return;
    entry.timers.forEach(clearTimeout);
    entry.timers = [];
    entry.animations.forEach(animation =&gt; animation.cancel());
    entry.animations = [];
    entry.phase = &#x27;entered&#x27;;
    entry.busy = false;
    shells.forEach(shell =&gt; {
      shell.querySelector(&#x27;.sh-entrance&#x27;).hidden = true;
      shell.classList.remove(&#x27;sh-gated&#x27;);
      setSiteAvailable(shell, true);
    });
    updateEntry();
    const visible = shells.find(shell =&gt; !shell.closest(&#x27;[data-variant]&#x27;).hidden) || first;
    arrive(visible, true);
    visible.querySelector(&#x27;.sh-nav[aria-current=&quot;page&quot;]&#x27;)?.focus({preventScroll: true});
    remember();
  }

  function openDoor() {
    if (entry.phase !== &#x27;locked&#x27;) return;
    entry.phase = &#x27;opening&#x27;;
    entry.busy = true;
    const visibleShell = shells.find(shell =&gt; !shell.closest(&#x27;[data-variant]&#x27;).hidden) || first;
    const visibleGate = visibleShell.querySelector(&#x27;.sh-entrance&#x27;);
    const gateBox = visibleGate.getBoundingClientRect();
    const openingBox = visibleGate.querySelector(&#x27;.sh-doorway&#x27;).getBoundingClientRect();
    shells.forEach(shell =&gt; {
      const gate = shell.querySelector(&#x27;.sh-entrance&#x27;);
      gate.style.setProperty(&#x27;--sh-hole-x&#x27;, openingBox.left - gateBox.left + &#x27;px&#x27;);
      gate.style.setProperty(&#x27;--sh-hole-y&#x27;, openingBox.top - gateBox.top + &#x27;px&#x27;);
      gate.style.setProperty(&#x27;--sh-hole-w&#x27;, openingBox.width + &#x27;px&#x27;);
      gate.style.setProperty(&#x27;--sh-hole-h&#x27;, openingBox.height + &#x27;px&#x27;);
    });
    updateEntry();
    doorOpeningSound();
    if (!state.motion || preference.matches) {
      finishEntry();
      return;
    }
    shells.forEach(shell =&gt; {
      const gate = shell.querySelector(&#x27;.sh-entrance&#x27;);
      animateEntry(gate.querySelector(&#x27;.sh-door-leaf&#x27;), [
        {transform: &#x27;rotateY(0deg)&#x27;, filter: &#x27;brightness(1)&#x27;, offset: 0},
        {transform: &#x27;rotateY(-8deg)&#x27;, filter: &#x27;brightness(.95)&#x27;, offset: .2},
        {transform: &#x27;rotateY(-108deg)&#x27;, filter: &#x27;brightness(.45)&#x27;, offset: 1},
      ], {duration: 1480, easing: &#x27;cubic-bezier(.4,.02,.25,1)&#x27;});
      animateEntry(gate, [
        {opacity: 1, transform: &#x27;scale(1)&#x27;, offset: 0},
        {opacity: 1, transform: &#x27;scale(1)&#x27;, offset: .47},
        {opacity: 0, transform: &#x27;scale(1.13)&#x27;, offset: 1},
      ], {duration: 1950, easing: &#x27;cubic-bezier(.45,0,.65,1)&#x27;});
      animateEntry(gate.querySelector(&#x27;.sh-entry-instructions&#x27;), [{opacity: 1}, {opacity: 0}], {duration: 450});
      animateEntry(gate.querySelector(&#x27;.sh-entry-brand&#x27;), [{opacity: 1}, {opacity: 0}], {duration: 600});
    });
    entry.timers.push(setTimeout(finishEntry, 1980));
    remember();
  }

  async function knock(shell) {
    if (entry.phase !== &#x27;locked&#x27; || entry.count + entry.queued &gt;= 3) return;
    if (entry.busy) {
      entry.queued++;
      updateEntry();
      return;
    }
    entry.busy = true;
    entry.count++;
    updateEntry();
    if (state.sound) await unlock();
    if (entry.phase !== &#x27;locked&#x27;) return;
    const gate = shell.querySelector(&#x27;.sh-entrance&#x27;);
    knockSound();
    const swing = animateEntry(gate.querySelector(&#x27;.sh-knocker-object&#x27;), [
      {transform: &#x27;rotateX(0deg)&#x27;, offset: 0},
      {transform: &#x27;rotateX(-35deg) translateY(-2px)&#x27;, offset: .35},
      {transform: &#x27;rotateX(5deg)&#x27;, offset: .48},
      {transform: &#x27;rotateX(-7deg)&#x27;, offset: .68},
      {transform: &#x27;rotateX(0deg)&#x27;, offset: 1},
    ], {duration: 470, easing: &#x27;ease-out&#x27;});
    const impact = animateEntry(gate.querySelector(&#x27;.sh-door-leaf&#x27;), [
      {transform: &#x27;translateX(0)&#x27;, offset: 0},
      {transform: &#x27;translateX(0)&#x27;, offset: .38},
      {transform: &#x27;translateX(-1.4px)&#x27;, offset: .5},
      {transform: &#x27;translateX(1px)&#x27;, offset: .65},
      {transform: &#x27;translateX(0)&#x27;, offset: 1},
    ], {duration: 470});
    entry.timers.push(setTimeout(() =&gt; entryDust(gate), 195));
    entry.timers.push(setTimeout(() =&gt; {
      swing?.cancel();
      impact?.cancel();
      if (entry.count === 3) openDoor();
      else {
        entry.busy = false;
        updateEntry();
        if (entry.queued &gt; 0) {
          entry.queued--;
          knock(shell);
        }
      }
    }, state.motion &amp;&amp; !preference.matches ? 490 : 160));
    remember();
  }

  function resetEntrance(focus = false) {
    if (activeArrival) cancelArrival(activeArrival);
    entry.timers.forEach(clearTimeout);
    entry.animations.forEach(animation =&gt; animation.cancel());
    entry.timers = [];
    entry.animations = [];
    entry.count = 0;
    entry.queued = 0;
    entry.busy = false;
    entry.phase = &#x27;locked&#x27;;
    shells.forEach((shell, index) =&gt; {
      shell.classList.add(&#x27;sh-gated&#x27;);
      const gate = shell.querySelector(&#x27;.sh-entrance&#x27;);
      gate.hidden = false;
      const status = gate.querySelector(&#x27;.sh-knock-status&#x27;);
      status.id = &#x27;sh-entry-status-&#x27; + index;
      gate.querySelector(&#x27;.sh-knocker&#x27;).setAttribute(&#x27;aria-describedby&#x27;, status.id);
      setSiteAvailable(shell, false);
    });
    updateEntry();
    if (focus) {
      const visible = shells.find(shell =&gt; !shell.closest(&#x27;[data-variant]&#x27;).hidden) || first;
      visible.querySelector(&#x27;.sh-knocker&#x27;).focus({preventScroll: true});
    }
  }

  shells.forEach(shell =&gt; {
    shell.querySelector(&#x27;.sh-knocker&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; knock(shell));
    shell.querySelector(&#x27;.sh-entry-reset&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
      resetEntrance(true);
      remember();
    });
    shell.querySelector(&#x27;.sh-entry-sound&#x27;).addEventListener(&#x27;click&#x27;, async () =&gt; {
      state.sound = !state.sound;
      if (state.sound) await unlock();
      render();
      remember();
    });
    shell.querySelectorAll(&#x27;[data-page]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, event =&gt; {
      clickSound();
      burst(shell, event);
      navigate(shell, button.dataset.page);
    }));
    shell.querySelector(&#x27;.sh-replay&#x27;).addEventListener(&#x27;click&#x27;, async () =&gt; {
      state.sound = true;
      const ready = await unlock();
      render();
      arrive(shell);
      if (!ready) toast(shell, &#x27;Arrival replayed. Audio is unavailable in this preview.&#x27;);
      remember();
    });
    shell.querySelector(&#x27;.sh-sound&#x27;).addEventListener(&#x27;click&#x27;, async () =&gt; {
      if (state.sound &amp;&amp; audio?.state === &#x27;running&#x27;) {
        state.sound = false;
        render();
      } else {
        state.sound = true;
        const ready = await unlock();
        state.sound = ready;
        render();
        if (ready) arrive(shell);
        else toast(shell, &#x27;Audio is unavailable in this preview.&#x27;);
      }
      remember();
    });
    shell.querySelector(&#x27;.sh-motion&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
      if (preference.matches) {
        toast(shell, &#x27;Your device’s reduced motion setting is active.&#x27;);
        return;
      }
      state.motion = !state.motion;
      if (!state.motion &amp;&amp; activeArrival) cancelArrival(activeArrival);
      render();
      remember();
    });
    shell.querySelector(&#x27;.sh-chain-button&#x27;).addEventListener(&#x27;click&#x27;, event =&gt; {
      const ctx = engine();
      if (ctx) {
        clunk(ctx.currentTime, false);
        noise(ctx.currentTime + .06, .55, .22, 1800, &#x27;highpass&#x27;, .7);
      }
      burst(shell, event, true);
      if (state.motion &amp;&amp; !preference.matches) {
        shell.classList.remove(&#x27;sh-impact&#x27;);
        void shell.offsetWidth;
        shell.classList.add(&#x27;sh-impact&#x27;);
        shell.querySelector(&#x27;.sh-gauge-needle&#x27;).animate([{transform: &#x27;rotate(-37deg)&#x27;}, {transform: &#x27;rotate(-112deg)&#x27;, offset: .6}, {transform: &#x27;rotate(-37deg)&#x27;}], {duration: 1100});
        setTimeout(() =&gt; shell.classList.remove(&#x27;sh-impact&#x27;), 950);
      }
      toast(shell, &#x27;Pressure released. Something answered.&#x27;);
    });
    shell.querySelector(&#x27;.sh-bell&#x27;).addEventListener(&#x27;click&#x27;, event =&gt; {
      clickSound(); burst(shell, event); toast(shell, &#x27;No new disturbances at the depot. Yet.&#x27;);
    });
    shell.querySelector(&#x27;.sh-avatar&#x27;).addEventListener(&#x27;click&#x27;, event =&gt; {
      clickSound(); burst(shell, event); toast(shell, &#x27;MK · Night shift operator&#x27;);
    });
  });

  window.addEventListener(&#x27;openai:set_globals&#x27;, event =&gt; {
    const values = event.detail?.globals?.widgetState?.modelContent;
    if (!values) return;
    if (typeof values.gore === &#x27;number&#x27;) state.gore = values.gore;
    if (typeof values.motion === &#x27;boolean&#x27;) state.motion = values.motion;
    if (typeof values.pace === &#x27;number&#x27;) state.pace = values.pace;
    if (!state.motion &amp;&amp; activeArrival) cancelArrival(activeArrival);
    if (!state.motion &amp;&amp; entry.phase === &#x27;opening&#x27;) finishEntry();
    render();
  });
  preference.addEventListener(&#x27;change&#x27;, () =&gt; {
    if (preference.matches &amp;&amp; activeArrival) cancelArrival(activeArrival);
    if (preference.matches &amp;&amp; entry.phase === &#x27;opening&#x27;) finishEntry();
    render();
  });
  const variantVisibility = new MutationObserver(() =&gt; {

  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
